name: Auto Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Sync dist to server
        uses: burnett01/rsync-deployments@v7.0.2
        with:
          switches: -avz --delete
          path: client/dist/
          remote_path: /var/www/prompt-library/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
