name: Auto Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Test SSH connection
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH connection successful'"
          rm deploy_key

      - name: Sync dist to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: client/dist/
          remote_path: /var/www/prompt-library/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT || '22' }}
          rsh: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
