[tool.poetry]
name = "khoprompt-server"
version = "0.1.1"
description = "FastAPI backend for khoprompt"
authors = []
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { version = "^0.35.0", extras = ["standard"] }
sqlalchemy = "^2.0.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}
alembic = "^1.16.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.7.0"
loguru = "^0.7.3"
python-jose = "^3.3.0"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-multipart = "^0.0.21"
bcrypt = "4.0.1"
redis = "^5.1.0"
requests = "^2.32.5"
httpx = "^0.28.1"
asyncpg = "^0.31.0"
openai = "^1.0.0"
PyJWT = "^2.8.0"
elasticsearch = "^8.15.0"
aiohttp = "^3.9.0"
apscheduler = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
